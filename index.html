<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DDARIN</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a7fd6">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DDARIN">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <img alt="불러오는 중" class="loading-gif" id="loadingGifImg">
  </div>

  <button type="button" id="backToCalendarBtn" class="back-to-calendar-btn" aria-label="뒤로가기">
    <svg viewBox="0 0 100 80" fill="none" stroke="#3a3f52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M55 15 L20 40 L55 65" />
      <path d="M20 40 H55 C75 40 85 50 85 68" />
    </svg>
  </button>

  <div class="page">
  <div class="app">
    <div id="todayScheduleCard" class="today-schedule-card hidden">
      <div class="today-schedule-header">
        <span id="todayScheduleHeaderLabel">오늘 일정</span>
        <span id="todayScheduleLive" class="today-schedule-live hidden">● LIVE</span>
      </div>
      <div class="today-schedule-body">
        <a id="todayScheduleThumbLink" class="today-schedule-thumb-link hidden" target="_blank" rel="noopener">
          <img id="todayScheduleThumb" class="today-schedule-thumb" alt="">
          <span id="todayScheduleThumbTitle" class="today-schedule-thumb-title"></span>
        </a>
        <div id="todayScheduleList" class="today-schedule-list"></div>
      </div>
    </div>
    <img src="today-mascot.png" alt="" class="page-top-mascot">

    <div class="calendar-header">
      <header class="toolbar">
        <button id="prevBtn" class="nav-btn" aria-label="이전 달">◀</button>
        <h1 id="monthTitle">1월</h1>
        <button id="nextBtn" class="nav-btn" aria-label="다음 달">▶</button>
        <div class="view-mode-toggle">
          <button type="button" id="viewModeWeekBtn" class="view-mode-btn">주간</button>
          <button type="button" id="viewModeMonthBtn" class="view-mode-btn active">월간</button>
        </div>
      </header>

      <div class="weekday-row">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>

    </div>

    <div id="grid" class="grid"></div>

    <div id="cardView" class="card-view hidden">
      <button type="button" id="weekPrevBtn" class="week-nav-btn" aria-label="이전 주">‹</button>
      <div id="cardList" class="card-list"></div>
      <button type="button" id="weekNextBtn" class="week-nav-btn" aria-label="다음 주">›</button>
    </div>
  </div>

  <div id="backMenuView" class="back-menu-view hidden">
    <div class="back-menu-grid">
      <button type="button" id="backMenuCalendarBtn" class="back-menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a3f52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/>
        </svg>
        <span class="back-menu-label color-calendar">calendar</span>
      </button>
      <button type="button" id="backMenuPlaylistBtn" class="back-menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a3f52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
          <path d="M9 18V6l12-2v12"/>
        </svg>
        <span class="back-menu-label color-playlist">playlist</span>
      </button>
      <button type="button" id="backMenuPostsBtn" class="back-menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a3f52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7l7 5-7 5z"/>
          <path d="M20 7l-7 5 7 5z"/>
          <circle cx="12" cy="12" r="1.4" fill="#3a3f52" stroke="none"/>
        </svg>
        <span class="back-menu-label color-posts">Photo</span>
      </button>
      <button type="button" id="backMenuSongbookBtn" class="back-menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3a3f52" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v18M4 8l16 8M20 8L4 16"/>
        </svg>
        <span class="back-menu-label color-songbook">songbook</span>
      </button>
    </div>
  </div>

  <div id="cafePhotosView" class="cafe-photos-view hidden">
    <h2 class="cafe-photos-title">🎁 팬아트</h2>
    <div id="cafePhotosList" class="cafe-photos-grid"></div>
  </div>

  <div id="songbookView" class="songbook-view hidden">
    <img src="today-mascot2.png" alt="" class="page-top-mascot">

    <div class="songbook-inner">
    <div class="songbook-header">
      <h1>Live Clip</h1>
      <div class="songbook-header-actions">
        <button type="button" id="deleteNoClipBtn" class="song-manage-btn song-manage-btn-danger hidden">클립 없는 곡 삭제</button>
        <select id="songSortSelect" class="song-sort-select">
          <option value="artist">가수이름순</option>
          <option value="title">가나다순</option>
        </select>
      </div>
    </div>

    <div class="songbook-body">
      <div class="player-panel">
        <div class="player-panel-header">
          <h2>플레이어</h2>
        </div>
        <div id="playerEmpty" class="player-empty">
          <p class="player-empty-title">재생할 곡이 없습니다</p>
          <p class="player-empty-sub">곡을 선택해보세요.</p>
        </div>
        <div id="playerNoClip" class="player-empty hidden">
          <p class="player-empty-title">클립이 없습니다</p>
          <p class="player-empty-sub" id="playerNoClipSong"></p>
        </div>
        <div class="player-controls">
          <button type="button" id="playerPrevBtn" class="player-btn" disabled>⏮</button>
          <button type="button" id="playerPlayBtn" class="player-btn player-btn-play" disabled>▶</button>
          <button type="button" id="playerNextBtn" class="player-btn" disabled>⏭</button>
        </div>

        <div class="player-favorites">
          <h3>즐겨찾기</h3>
          <div id="favoritesList" class="favorites-list"></div>
        </div>

        <div class="player-artists">
          <h3>가수</h3>
          <div id="artistList" class="artist-list"></div>
        </div>
      </div>

      <div class="songbook-main">
        <input type="text" id="songSearchInput" class="song-search" placeholder="노래 제목 또는 가수를 검색하세요">

        <div class="view-toggle">
          <button type="button" id="songNoImageBtn" class="view-toggle-btn" title="이미지 없이" aria-label="이미지 없이">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="4" y1="12" x2="20" y2="12"/>
              <line x1="4" y1="18" x2="20" y2="18"/>
            </svg>
          </button>
          <button type="button" id="songImageBtn" class="view-toggle-btn active" title="클립 썸네일" aria-label="클립 썸네일">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="3" width="8" height="8" rx="2"/>
              <rect x="13" y="3" width="8" height="8" rx="2"/>
              <rect x="3" y="13" width="8" height="8" rx="2"/>
              <rect x="13" y="13" width="8" height="8" rx="2"/>
            </svg>
          </button>
        </div>

        <div id="genreTabs" class="genre-tabs">
          <button type="button" class="genre-tab active" data-genre="전체">전체</button>
        </div>

        <div id="songGrid" class="song-grid"></div>
      </div>
    </div>
    </div>
  </div>

  <div id="songbook2View" class="songbook-view hidden">
    <img src="today-mascot2.png" alt="" class="page-top-mascot">

    <div class="songbook-inner">
    <div class="songbook-header">
      <h1>노래책</h1>
      <div class="songbook-header-actions">
        <button type="button" id="songManageBtn" class="song-gear-btn hidden" aria-label="곡 관리" title="곡 관리">⚙️</button>
        <div id="songManageToolbar" class="song-manage-toolbar hidden">
          <button type="button" id="songAddBtn" class="song-manage-btn" aria-label="곡 추가" title="곡 추가">+</button>
          <button type="button" id="songSelectAllBtn" class="song-manage-btn">전체선택</button>
          <button type="button" id="songDeleteSelectedBtn" class="song-manage-btn song-manage-btn-danger">선택삭제</button>
          <button type="button" id="songQueueAddBtn" class="song-manage-btn">대기열 추가</button>
          <button type="button" id="songManageCloseBtn" class="song-manage-close-btn" aria-label="곡 관리 닫기" title="닫기">✕</button>
        </div>
        <select id="song2SortSelect" class="song-sort-select">
          <option value="artist">가수이름순</option>
          <option value="title">가나다순</option>
          <option value="recent">최근 등록순</option>
        </select>
      </div>
    </div>

    <div class="songbook-body">
      <div class="player-panel">
        <div class="player-favorites">
          <h3>즐겨찾기</h3>
          <div id="favorites2List" class="favorites-list"></div>
        </div>

        <div class="player-favorites">
          <h3>대기열</h3>
          <div id="singQueueList" class="favorites-list"></div>
        </div>

        <div class="player-artists">
          <h3>가수</h3>
          <div id="artist2List" class="artist-list"></div>
        </div>
      </div>

      <div class="songbook-main">
        <input type="text" id="song2SearchInput" class="song-search" placeholder="노래 제목 또는 가수를 검색하세요">

        <div id="genre2Tabs" class="genre-tabs">
          <button type="button" class="genre-tab active" data-genre="전체">전체</button>
        </div>

        <div id="song2Grid" class="song-grid no-image-mode"></div>
      </div>
    </div>
    </div>
  </div>

  <div id="songAddModalBackdrop" class="modal-backdrop hidden">
    <div class="modal song-add-modal">
      <div class="modal-header-row">
        <h2 id="songAddModalTitle">곡 추가</h2>
        <button type="button" id="closeSongAddModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <form id="songAddForm" class="song-add-form" autocomplete="off">
        <div class="song-add-row song-add-row-2">
          <label class="song-add-field">
            <span class="song-add-label">제목</span>
            <input type="text" id="songAddTitleInput" class="song-add-input" placeholder="제목" maxlength="200" required autocomplete="off">
          </label>
          <label class="song-add-field">
            <span class="song-add-label">가수</span>
            <input type="text" id="songAddArtistInput" class="song-add-input" placeholder="가수" maxlength="200" required autocomplete="off">
          </label>
        </div>
        <div class="song-add-row song-add-row-2">
          <div class="song-add-field">
            <span class="song-add-label">장르</span>
            <div class="song-select" id="songAddGenreSelect">
              <button type="button" class="song-select-trigger">
                <span class="song-select-trigger-label placeholder">장르 선택</span>
                <span class="song-select-arrow">▾</span>
              </button>
              <div class="song-select-panel hidden"></div>
            </div>
          </div>
          <label class="song-add-field">
            <span class="song-add-label">비고</span>
            <input type="text" id="songAddNoteInput" class="song-add-input" placeholder="비고 (쉼표로 여러개)" autocomplete="off">
          </label>
        </div>
        <label class="song-add-field song-add-field-full">
          <span class="song-add-label">MR</span>
          <input type="text" id="songAddMrInput" class="song-add-input" placeholder="MR (시청자 화면에는 표시되지 않아요)" autocomplete="off">
        </label>
        <div class="song-add-actions">
          <button type="submit" id="songAddSaveBtn" class="song-add-save-btn">저장</button>
          <button type="button" id="cancelSongAddBtn" class="song-add-cancel-btn">취소</button>
        </div>
      </form>
    </div>
  </div>

  <div id="gameView" class="songbook-view hidden">
    <img src="today-mascot3.png" alt="" class="page-top-mascot">
    <div class="game-tabs">
      <button type="button" class="game-tab active" data-game="ladder">사다리</button>
      <button type="button" class="game-tab" data-game="roulette">룰렛</button>
    </div>

    <div id="ladderPanel" class="game-panel ladder-panel">
      <div class="ladder-toolbar ladder-toolbar-stacked">
        <div class="ladder-toolbar-top">
          <div class="ladder-stepper" id="ladderStepperWrap">
            <button type="button" id="ladderCountMinus" class="ladder-stepper-btn" aria-label="참가자 줄이기">‹</button>
            <span id="ladderCountLabel">항목 2개</span>
            <button type="button" id="ladderCountPlus" class="ladder-stepper-btn" aria-label="참가자 늘리기">›</button>
          </div>
          <div class="ladder-actions" id="ladderMainActions">
            <button type="button" id="ladderStartBtn" class="ladder-action-btn ladder-start-btn" disabled>▷ START</button>
            <button type="button" id="ladderResetBtn" class="ladder-reset-icon-btn" aria-label="초기화">↻</button>
            <button type="button" id="ladderShuffleBtn" class="ladder-action-btn">사다리 섞기</button>
          </div>
        </div>
        <div class="ladder-toolbar-bottom">
          <div class="ladder-speed-row">
            <span class="ladder-speed-label">속도</span>
            <input type="range" id="ladderSpeedSlider" min="1" max="10" value="5">
          </div>
          <button type="button" id="ladderBlindBtn" class="ladder-action-btn ladder-blind-btn">Blind</button>
        </div>
      </div>
      <div id="ladderError" class="sheet-status error hidden"></div>
      <div id="ladderNamesRow" class="ladder-row"></div>
      <canvas id="ladderCanvas" class="ladder-canvas"></canvas>
      <div id="ladderResultsRow" class="ladder-row"></div>
    </div>

    <div id="roulettePanel" class="game-panel roulette-panel hidden">
      <div class="ladder-toolbar">
        <div class="ladder-stepper">
          <button type="button" id="rouletteCountMinus" class="ladder-stepper-btn" aria-label="항목 줄이기">‹</button>
          <span id="rouletteCountLabel">항목 4개</span>
          <button type="button" id="rouletteCountPlus" class="ladder-stepper-btn" aria-label="항목 늘리기">›</button>
        </div>
        <div class="ladder-actions">
          <button type="button" id="rouletteSettingsBtn" class="ladder-action-btn">☰ 항목 선택</button>
          <button type="button" id="rouletteStartBtn" class="ladder-action-btn ladder-start-btn">▷ START</button>
          <button type="button" id="rouletteResetBtn" class="ladder-action-btn">초기화</button>
        </div>
      </div>
      <div id="rouletteError" class="sheet-status error hidden"></div>

      <div class="roulette-body">
        <div class="roulette-wheel-wrap">
          <div class="roulette-canvas-clip">
            <canvas id="rouletteCanvas" class="roulette-canvas" width="560" height="560"></canvas>
          </div>
          <div class="roulette-pointer">▼</div>
        </div>
      </div>
    </div>

  </div>

  <div id="ladderResultModalBackdrop" class="modal-backdrop hidden">
    <div class="modal ladder-result-modal">
      <div class="modal-header-row">
        <h2>사다리 결과</h2>
        <button type="button" id="closeLadderResultModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <div id="ladderResultModalList" class="ladder-result-list"></div>
    </div>
  </div>

  <div id="rouletteSettingsModalBackdrop" class="modal-backdrop hidden">
    <div class="modal roulette-settings-modal">
      <div class="modal-header-row">
        <h2>항목 선택</h2>
        <button type="button" id="closeRouletteSettingsModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <div id="rouletteSettingsInputs" class="roulette-settings-inputs"></div>
      <button type="button" id="rouletteSettingsCloseBtn" class="game-primary-btn">확인</button>
    </div>
  </div>

  <div id="rouletteResultModalBackdrop" class="modal-backdrop hidden">
    <div class="modal ladder-result-modal">
      <div class="modal-header-row">
        <h2>룰렛 결과</h2>
        <button type="button" id="closeRouletteResultModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <div id="rouletteResultCard" class="result-card"></div>
    </div>
  </div>

  <nav class="side-nav">
    <button type="button" id="menuToggleBtn" class="side-nav-btn" aria-label="메뉴">
      <img class="side-nav-icon" src="메뉴판2.png" alt="">
    </button>
    <div id="sideNavItems" class="side-nav-items hidden">
      <button type="button" id="calendarBtn" class="side-nav-btn" aria-label="일정표">
        <img class="side-nav-icon" src="일정표.png" alt="">일정표
      </button>
      <button type="button" id="songbook2Btn" class="side-nav-btn" aria-label="노래책">
        <img class="side-nav-icon" src="노래책.png" alt="">노래책
      </button>
      <button type="button" id="songbookBtn" class="side-nav-btn" aria-label="Live Clip">
        <img class="side-nav-icon" src="노래책.png" alt="">Live Clip
      </button>
      <a class="side-nav-btn" href="https://www.youtube.com/@DDARINEE" target="_blank" rel="noopener" aria-label="유튜브">
        <img class="side-nav-icon" src="유튜브.png" alt="">유튜브
      </a>
      <button type="button" id="memoBtn" class="side-nav-btn" aria-label="메모">
        <img class="side-nav-icon" src="메모.png" alt="">메모
      </button>
      <button type="button" id="gameBtn" class="side-nav-btn" aria-label="게임">
        <img class="side-nav-icon" src="게임메뉴.png" alt="">게임
      </button>
      <button type="button" id="editLockBtn" class="side-nav-btn" title="로그인" aria-label="로그인">
        <img class="side-nav-icon" src="로그인.png" alt=""><span id="loginBtnLabel">로그인</span>
      </button>
    </div>
  </nav>
  </div>

  <div id="dayCellMenu" class="day-cell-menu hidden">
    <button type="button" id="dayCellSoopBtn" class="day-cell-menu-item">
      <img class="day-cell-menu-icon" src="soop-icon.png" alt="">
      <span id="dayCellSoopBtnLabel">방송 요약</span>
    </button>
    <div id="dayCellSoopSummary" class="day-cell-summary hidden"></div>
  </div>

  <div id="songPlayerModalBackdrop" class="song-player-modal-backdrop hidden">
    <div id="songPlayerModal" class="song-player-modal">
      <div class="song-player-drag-handle"></div>
      <span class="song-player-resize-handle" data-corner="nw"></span>
      <span class="song-player-resize-handle" data-corner="ne"></span>
      <span class="song-player-resize-handle" data-corner="sw"></span>
      <span class="song-player-resize-handle" data-corner="se"></span>
      <button type="button" id="songPlayerModalClose" class="song-player-modal-close" aria-label="닫기">✕</button>
      <iframe id="songPlayerModalFrame" class="song-player-modal-frame" allow="autoplay; encrypted-media" allowfullscreen frameborder="0"></iframe>
      <div class="song-player-modal-info">
        <h3 id="songPlayerModalTitle" class="song-player-modal-title"></h3>
        <span id="songPlayerModalArtist" class="song-player-modal-artist"></span>
        <button type="button" id="songPlayerModalFavBtn" class="song-player-modal-fav-btn">
          <span id="songPlayerModalFavIcon">☆</span> <span id="songPlayerModalFavLabel">즐겨찾기 추가</span>
        </button>
      </div>
    </div>
  </div>


  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header-row">
        <h2 id="modalDate">일정</h2>
        <button type="button" id="closeModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>

      <div id="eventList" class="event-list"></div>

      <a id="modalSoopNotice" class="modal-soop-notice hidden" target="_blank" rel="noopener">
        <div class="modal-soop-notice-header">
          <span>공지사항</span>
          <span class="modal-soop-notice-goto">바로가기 ↗</span>
        </div>
        <div id="modalSoopNoticeTitle" class="modal-soop-notice-title"></div>
        <div id="modalSoopNoticeContent" class="modal-soop-notice-content"></div>
      </a>

      <a id="modalCafeNotice" class="modal-cafe-notice hidden" target="_blank" rel="noopener">
        <div class="modal-cafe-notice-header">
          <span>따카오톡</span>
          <span class="modal-cafe-notice-goto">바로가기 ↗</span>
        </div>
        <div id="modalCafeNoticeTitle" class="modal-cafe-notice-title"></div>
      </a>

      <form id="eventForm" autocomplete="off">
        <div class="event-field">
          <label class="event-field-label" for="eventTitle">일정 제목</label>
          <input type="text" id="eventTitle" placeholder="일정" required maxlength="100" autocomplete="off">
        </div>
        <div class="event-field-row">
          <div class="event-field event-field-half">
            <label class="event-field-label">유형</label>
            <div class="color-picker-dropdown">
              <button type="button" id="colorPickerBtn" class="color-picker-btn">
                <span id="colorPickerBtnLabel">갠방</span>
                <span class="color-picker-arrow">⌄</span>
              </button>
              <div id="colorPickerList" class="color-picker-list hidden">
                <button type="button" class="color-picker-option" data-value="gray" style="background:#e2e2e2;">갠방</button>
                <button type="button" class="color-picker-option" data-value="blue" style="background:#cfe8fb;">종겜</button>
                <button type="button" class="color-picker-option" data-value="purple" style="background:#e5d9fb;">합방</button>
                <button type="button" class="color-picker-option" data-value="yellow" style="background:#fffbd6;">노래관련</button>
                <button type="button" class="color-picker-option" data-value="green" style="background:#d3f3d8;">게임 출시</button>
                <button type="button" class="color-picker-option" data-value="#cc0000" style="background:#f6d1d1;">휴방</button>
                <button type="button" class="color-picker-option" data-value="#e951d0" style="background:#fbe0f6;">커머스</button>
                <button type="button" class="color-picker-option" data-value="#ff6f00" style="background:#ffe5d1;">같이보기</button>
              </div>
            </div>
          </div>
          <div class="event-field event-field-half">
            <label class="event-field-label" for="eventAttendees">참여 멤버</label>
            <div class="attendees-input-row">
              <span class="attendees-icon">👤</span>
              <input type="text" id="eventAttendees" placeholder="참여 멤버 (쉼표로 구분)" maxlength="200" autocomplete="off">
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="submit" id="eventSubmitBtn" class="primary-btn">추가</button>
        </div>
      </form>

      <div id="modalManageActions" class="modal-manage-actions hidden">
        <button type="button" id="bulkDeleteBtn" class="modal-manage-btn modal-manage-btn-danger">일괄 삭제</button>
        <button type="button" id="newEventBtn" class="modal-manage-btn modal-manage-btn-primary">+ 새 일정</button>
      </div>
    </div>
  </div>

  <div id="loginModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2>로그인</h2>
      <form id="loginForm">
        <input type="password" id="loginUsernameInput" class="login-input" placeholder="아이디" autocomplete="username" required>
        <input type="password" id="loginPasswordInput" class="login-input" placeholder="비밀번호" autocomplete="current-password" required>
        <label class="login-remember-row">
          <input type="checkbox" id="loginRememberInput">
          로그인 상태 유지
        </label>
        <div id="loginError" class="sheet-status error hidden">아이디 또는 비밀번호가 틀렸습니다.</div>
        <div class="modal-actions">
          <button type="submit" class="primary-btn">로그인</button>
          <button type="button" id="closeLoginModalBtn">취소</button>
        </div>
      </form>
    </div>
  </div>

  <div id="memoOverlay" class="memo-overlay hidden"></div>
  <div id="memoPanel" class="memo-panel hidden">
    <div class="memo-panel-header">
      <h2>메모</h2>
      <button type="button" id="closeMemoBtn" class="memo-panel-close" aria-label="닫기">✕</button>
    </div>
    <div class="memo-tabs">
      <button type="button" id="memoTabShared" class="memo-tab">공유</button>
      <button type="button" id="memoTabPersonal" class="memo-tab">개인</button>
      <button type="button" id="memoAddToggleBtn" class="memo-add-toggle-btn" aria-label="메모 추가">+</button>
    </div>
    <div class="memo-section hidden" id="memoPersonalSection">
      <div id="memoPersonalList" class="memo-card-list"></div>
    </div>
    <div class="memo-section" id="memoSharedSection">
      <div id="memoSharedList" class="memo-card-list"></div>
    </div>
  </div>

  <div id="memoAddModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header-row">
        <h2 id="memoAddModalTitle">메모 추가</h2>
        <button type="button" id="closeMemoAddModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <form id="memoAddForm">
        <div id="memoAddFieldsGrid" class="memo-add-fields-grid">
          <input type="date" id="memoAddDateInput" class="memo-add-modal-input">
          <input type="text" id="memoAddTitleInput" class="memo-add-modal-input" placeholder="메모 제목" maxlength="200" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="memoAddMoreBtn" class="memo-add-more-btn" aria-label="입력칸 추가">+</button>
          <button type="submit" class="primary-btn">추가</button>
        </div>
      </form>
    </div>
  </div>

  <div id="todayMemoModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header-row">
        <h2>오늘의 메모</h2>
        <button type="button" id="closeTodayMemoModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <div id="todayMemoModalList" class="today-memo-list"></div>
      <div class="modal-actions today-popup-actions">
        <button type="button" id="todayMemoHideTodayBtn">오늘 하루 보지 않기</button>
        <button type="button" id="todayMemoCloseBtn" class="primary-btn">닫기</button>
      </div>
    </div>
  </div>

  <div id="todayYoutubeModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header-row">
        <h2>새 영상 소식</h2>
        <button type="button" id="closeTodayYoutubeModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <div id="todayYoutubeModalList" class="today-video-list"></div>
      <div class="modal-actions today-popup-actions">
        <button type="button" id="todayYoutubeHideTodayBtn">오늘 하루 보지 않기</button>
        <button type="button" id="todayYoutubeHideWeekBtn">일주일간 보지 않기</button>
        <button type="button" id="todayYoutubeCloseBtn" class="primary-btn">닫기</button>
      </div>
    </div>
  </div>


  <script src="app.js"></script>
  <script src="games.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      let swRefreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (swRefreshed) return;
        swRefreshed = true;
        location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js", { updateViaCache: "none" })
          .then((reg) => reg.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
