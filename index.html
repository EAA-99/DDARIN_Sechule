<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DDARIN</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a7fd6">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DDARIN">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <img src="loading.gif" alt="불러오는 중" class="loading-gif">
  </div>

  <div class="page">
  <div class="app">
    <div class="calendar-header">
      <button id="sheetSettingsBtn" class="sheet-corner-btn hidden">📄 구글 시트 연동</button>

      <header class="toolbar">
        <button id="prevBtn" class="nav-btn" aria-label="이전 달">◀</button>
        <h1 id="monthTitle">1월</h1>
        <button id="nextBtn" class="nav-btn" aria-label="다음 달">▶</button>
      </header>

      <div class="weekday-row">
        <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span><span class="sun">일</span>
      </div>

      <div class="view-toggle">
        <button type="button" id="listViewBtn" class="view-toggle-btn active" title="목록형" aria-label="목록형">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        </button>
        <button type="button" id="cardViewBtn" class="view-toggle-btn" title="카드형" aria-label="카드형">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="3" width="8" height="8" rx="2"/>
            <rect x="13" y="3" width="8" height="8" rx="2"/>
            <rect x="3" y="13" width="8" height="8" rx="2"/>
            <rect x="13" y="13" width="8" height="8" rx="2"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="grid" class="grid"></div>

    <div id="cardView" class="card-view hidden">
      <button type="button" id="weekPrevBtn" class="week-nav-btn" aria-label="이전 주">‹</button>
      <div id="cardList" class="card-list"></div>
      <button type="button" id="weekNextBtn" class="week-nav-btn" aria-label="다음 주">›</button>
    </div>
  </div>

  <nav class="side-nav">
    <button type="button" id="songbookBtn" class="side-nav-btn" aria-label="노래책">
      <span class="side-nav-icon">🎵</span>노래책
    </button>
    <a class="side-nav-btn" href="https://www.youtube.com/@DDARINEE" target="_blank" rel="noopener" aria-label="유튜브">
      <span class="side-nav-icon">▶️</span>유튜브
    </a>
    <button type="button" id="editLockBtn" class="side-nav-btn" title="로그인" aria-label="로그인">
      <span class="side-nav-icon">🔑</span><span id="loginBtnLabel">로그인</span>
    </button>
  </nav>
  </div>

  <div id="songbookView" class="songbook-view hidden">
    <div id="songbookLoadingScreen" class="loading-screen hidden">
      <img src="songbook-loading.gif" alt="앨범 이미지 불러오는 중" class="loading-gif">
    </div>

    <div class="songbook-header">
      <button type="button" id="songbookBackBtn" class="songbook-back-btn">← 달력으로</button>
      <h1>노래책</h1>
      <select id="songSortSelect" class="song-sort-select">
        <option value="artist">가수이름순</option>
        <option value="title">가나다순</option>
      </select>
    </div>

    <div class="songbook-body">
      <div class="player-panel">
        <div class="player-panel-header">
          <h2>플레이어</h2>
          <a href="https://login.sooplive.com/afreeca/login.php" target="_blank" rel="noopener" class="soop-login-link">SOOP 로그인</a>
        </div>
        <div id="playerEmpty" class="player-empty">
          <p class="player-empty-title">재생할 곡이 없습니다</p>
          <p class="player-empty-sub">곡을 선택해보세요.</p>
        </div>
        <div id="playerNoClip" class="player-empty hidden">
          <p class="player-empty-title">클립이 없습니다</p>
          <p class="player-empty-sub" id="playerNoClipSong"></p>
        </div>
        <div id="playerFrameWrap" class="player-frame-wrap hidden">
          <p id="playerCurrentTitle" class="player-current-title"></p>
          <iframe id="playerFrame" class="player-frame" allow="autoplay" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="player-controls">
          <button type="button" id="playerPrevBtn" class="player-btn" disabled>⏮</button>
          <button type="button" id="playerPlayBtn" class="player-btn player-btn-play" disabled>▶</button>
          <button type="button" id="playerNextBtn" class="player-btn" disabled>⏭</button>
        </div>

        <div class="player-favorites">
          <h3>즐겨찾기</h3>
          <div id="favoritesList" class="favorites-list"></div>
        </div>
      </div>

      <div class="songbook-main">
        <input type="text" id="songSearchInput" class="song-search" placeholder="노래 제목 또는 가수를 검색하세요">

        <div class="view-toggle">
          <button type="button" id="songNoImageBtn" class="view-toggle-btn" title="이미지 없이" aria-label="이미지 없이">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="4" y1="12" x2="20" y2="12"/>
              <line x1="4" y1="18" x2="20" y2="18"/>
            </svg>
          </button>
          <button type="button" id="songImageBtn" class="view-toggle-btn active" title="클립 썸네일" aria-label="클립 썸네일">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="3" width="8" height="8" rx="2"/>
              <rect x="13" y="3" width="8" height="8" rx="2"/>
              <rect x="3" y="13" width="8" height="8" rx="2"/>
              <rect x="13" y="13" width="8" height="8" rx="2"/>
            </svg>
          </button>
        </div>

        <div id="genreTabs" class="genre-tabs">
          <button type="button" class="genre-tab active" data-genre="전체">전체</button>
        </div>

        <div id="songGrid" class="song-grid"></div>
      </div>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="modalDate">일정</h2>

      <div id="eventList" class="event-list"></div>

      <form id="eventForm">
        <input type="text" id="eventTitle" placeholder="일정 제목" required maxlength="100">
        <div class="attendees-input-row">
          <span class="attendees-icon">👤</span>
          <input type="text" id="eventAttendees" placeholder="참석자 이름 (쉼표로 구분)" maxlength="200">
        </div>
        <div id="colorPicker" class="color-picker">
          <button type="button" class="color-swatch" data-color="blue" style="background:#cfe8fb"></button>
          <button type="button" class="color-swatch" data-color="gray" style="background:#e2e2e2"></button>
          <button type="button" class="color-swatch" data-color="pink" style="background:#fbd7e4"></button>
          <button type="button" class="color-swatch" data-color="green" style="background:#d3f3d8"></button>
          <button type="button" class="color-swatch" data-color="purple" style="background:#e5d9fb"></button>
          <button type="button" class="color-swatch" data-color="orange" style="background:#fde3c7"></button>
        </div>
        <div class="modal-actions">
          <button type="submit" id="eventSubmitBtn" class="primary-btn">추가</button>
          <button type="button" id="closeModalBtn">닫기</button>
        </div>
      </form>
    </div>
  </div>

  <div id="sheetModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2>구글 시트 연동 (불러오기)</h2>

      <p class="sheet-help">Apps Script 웹앱 URL(<code>/exec</code>로 끝나는 주소)을 입력하면 자동으로 불러옵니다.</p>
      <input type="url" id="sheetUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="modal-actions" style="justify-content:flex-start; margin-bottom:14px;">
        <button type="button" id="sheetAutoImportBtn" class="primary-btn">자동 불러오기</button>
      </div>

      <p class="sheet-help">
        자동으로 안 될 경우: 위 URL을 새 탭에서 열어 <b>Ctrl+A → Ctrl+C</b>로 전체 복사한 뒤 아래에 붙여넣으세요.
      </p>
      <textarea id="sheetJsonInput" placeholder='여기에 [{"date":"2026-08-01","title":"..."}, ...] 형태의 내용을 붙여넣으세요'></textarea>

      <div id="sheetStatus" class="sheet-status"></div>
      <div class="modal-actions">
        <button type="button" id="sheetImportBtn" class="primary-btn">붙여넣은 내용 가져오기</button>
        <button type="button" id="closeSheetModalBtn">닫기</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
