      </div>
    </div>
  </div>

  <div id="loginModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2>로그인</h2>
      <form id="loginForm">
        <input type="password" id="loginUsernameInput" class="login-input" placeholder="아이디" autocomplete="username" required>
        <input type="password" id="loginPasswordInput" class="login-input" placeholder="비밀번호" autocomplete="current-password" required>
        <label class="login-remember-row">
          <input type="checkbox" id="loginRememberInput">
          로그인 상태 유지
        </label>
        <div id="loginError" class="sheet-status error hidden">아이디 또는 비밀번호가 틀렸습니다.</div>
        <div class="modal-actions">
          <button type="submit" class="primary-btn">로그인</button>
          <button type="button" id="closeLoginModalBtn">취소</button>
        </div>
      </form>
    </div>
  </div>

  <div id="memoOverlay" class="memo-overlay hidden"></div>
  <div id="memoPanel" class="memo-panel hidden">
    <div class="memo-panel-header">
      <h2>메모</h2>
      <button type="button" id="closeMemoBtn" class="memo-panel-close" aria-label="닫기">✕</button>
    </div>
    <div class="memo-tabs">
      <button type="button" id="memoTabShared" class="memo-tab">공유</button>
      <button type="button" id="memoTabPersonal" class="memo-tab">개인</button>
      <button type="button" id="memoAddToggleBtn" class="memo-add-toggle-btn" aria-label="메모 추가">+</button>
    </div>
    <div class="memo-section hidden" id="memoPersonalSection">
      <div id="memoPersonalList" class="memo-card-list"></div>
    </div>
    <div class="memo-section" id="memoSharedSection">
      <div id="memoSharedList" class="memo-card-list"></div>
    </div>
  </div>

  <div id="memoAddModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header-row">
        <h2 id="memoAddModalTitle">메모 추가</h2>
        <button type="button" id="closeMemoAddModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <form id="memoAddForm">
        <div id="memoAddFieldsGrid" class="memo-add-fields-grid">
          <input type="date" id="memoAddDateInput" class="memo-add-modal-input">
          <input type="text" id="memoAddTitleInput" class="memo-add-modal-input" placeholder="메모 제목" maxlength="200" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="memoAddMoreBtn" class="memo-add-more-btn" aria-label="입력칸 추가">+</button>
          <button type="submit" class="primary-btn">추가</button>
        </div>
      </form>
    </div>
  </div>

  <div id="todayMemoModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header-row">
        <h2>오늘의 메모</h2>
        <button type="button" id="closeTodayMemoModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <div id="todayMemoModalList" class="today-memo-list"></div>
      <div class="modal-actions today-popup-actions">
        <button type="button" id="todayMemoHideTodayBtn">오늘 하루 보지 않기</button>
        <button type="button" id="todayMemoCloseBtn" class="primary-btn">닫기</button>
      </div>
    </div>
  </div>

  <div id="todayYoutubeModalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header-row">
        <h2>새 영상 소식</h2>
        <button type="button" id="closeTodayYoutubeModalBtn" class="modal-close-x" aria-label="닫기">✕</button>
      </div>
      <div id="todayYoutubeModalList" class="today-video-list"></div>
      <div class="modal-actions today-popup-actions">
        <button type="button" id="todayYoutubeHideTodayBtn">오늘 하루 보지 않기</button>
        <button type="button" id="todayYoutubeHideWeekBtn">일주일간 보지 않기</button>
        <button type="button" id="todayYoutubeCloseBtn" class="primary-btn">닫기</button>
      </div>
    </div>
  </div>


  <script src="app.js"></script>
  <script src="games.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      let swRefreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (swRefreshed) return;
        swRefreshed = true;
        location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js", { updateViaCache: "none" })
          .then((reg) => reg.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
