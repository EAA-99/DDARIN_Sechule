<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대기열 오버레이</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Malgun Gothic", "Segoe UI", sans-serif;
  }

  #queueList {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
    width: fit-content;
  }

  .queue-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--overlay-bg, rgba(20, 20, 28, 0.78));
    border-radius: 18px;
    padding: 12px 18px;
    width: 240px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    font-family: var(--overlay-font, "Malgun Gothic", "Segoe UI", sans-serif);
  }

  .queue-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--overlay-color, #ffffff);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .queue-row-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .queue-artist {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--overlay-color, #c9c9d6);
    opacity: 0.75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .queue-time {
    flex-shrink: 0;
    font-size: 0.7rem;
    color: var(--overlay-color, #9a9aa6);
    opacity: 0.55;
  }

  .queue-empty {
    background: rgba(20, 20, 28, 0.72);
    border-radius: 12px;
    padding: 12px 18px;
    color: #c9c9d6;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <div id="queueList"></div>

  <script>
    const SONGBOOK_SPREADSHEET_ID = "1NhImCLm5diXM0pA45SkB-g2PARivQiVN8bUKlniiOB8";
    const SHEETS_API_KEY = "AIzaSyC0RsFfc5y9GmEaE29niGWD9hbSnpIc7rM";
    const POLL_MS = 5000;

    function albumArtCacheKey(song) {
      return `${song.artist}|${song.title}`.toLowerCase();
    }

    async function fetchSongbookGenres() {
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${SONGBOOK_SPREADSHEET_ID}?key=${SHEETS_API_KEY}&fields=sheets.properties.title`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      return (data.sheets || [])
        .map((s) => s.properties.title)
        .filter((title) => !/^시트\d+$/.test(title));
    }

    async function fetchSongbookSongs() {
      const genres = await fetchSongbookGenres();
      if (!genres.length) return [];
      const ranges = genres.map((g) => `ranges=${encodeURIComponent(`'${g}'!C2:D`)}`).join("&");
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${SONGBOOK_SPREADSHEET_ID}/values:batchGet?${ranges}&key=${SHEETS_API_KEY}`;
      const res = await fetch(url);
      if (!res.ok) return [];
      const data = await res.json();
      const songs = [];
      (data.valueRanges || []).forEach((vr, i) => {
        const genre = genres[i];
        (vr.values || []).forEach((row) => {
          const [artist, title] = row;
          if (!title) return;
          songs.push({ genre, artist: artist || "", title });
        });
      });
      return songs;
    }

    async function fetchLocalOverrides() {
      try {
        const res = await fetch("/api/songbook");
        if (!res.ok) return { overrides: {}, deletions: [] };
        const data = await res.json();
        return { overrides: data.overrides || {}, deletions: data.deletions || [] };
      } catch {
        return { overrides: {}, deletions: [] };
      }
    }

    let songByKey = {};

    async function loadSongbook() {
      const [songs, local] = await Promise.all([fetchSongbookSongs(), fetchLocalOverrides()]);
      const deletions = new Set(local.deletions);
      songByKey = {};
      songs.forEach((song) => {
        const key = albumArtCacheKey(song);
        if (deletions.has(key)) return;
        const finalSong = local.overrides[key] || song;
        songByKey[key] = finalSong;
      });
      Object.keys(local.overrides).forEach((key) => {
        if (songByKey[key] || deletions.has(key)) return;
        songByKey[key] = local.overrides[key];
      });
    }

    async function fetchQueue() {
      try {
        const res = await fetch("/api/songbook?resource=queue");
        if (!res.ok) return { keys: [], times: {} };
        const data = await res.json();
        return {
          keys: Array.isArray(data.queue) ? data.queue : [],
          times: data.times && typeof data.times === "object" ? data.times : {},
        };
      } catch {
        return { keys: [], times: {} };
      }
    }

    function formatRelativeTime(ts) {
      if (!ts) return "";
      const diffSec = Math.floor((Date.now() - ts) / 1000);
      if (diffSec < 60) return "방금 전";
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}분 전`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}시간 전`;
      const diffDay = Math.floor(diffHour / 24);
      return `${diffDay}일 전`;
    }

    function renderQueue(keys, times) {
      const listEl = document.getElementById("queueList");
      const validKeys = keys.filter((k) => songByKey[k]);
      const songs = validKeys.map((k) => songByKey[k]);

      if (!songs.length) {
        listEl.innerHTML = `<div class="queue-empty">대기열이 비어 있습니다</div>`;
        return;
      }

      listEl.innerHTML = songs
        .map(
          () => `
            <div class="queue-row">
              <span class="queue-title"></span>
              <div class="queue-row-bottom">
                <span class="queue-artist"></span>
                <span class="queue-time"></span>
              </div>
            </div>`
        )
        .join("");

      listEl.querySelectorAll(".queue-row").forEach((row, i) => {
        row.querySelector(".queue-title").textContent = songs[i].title;
        row.querySelector(".queue-artist").textContent = songs[i].artist;
        row.querySelector(".queue-time").textContent = formatRelativeTime(times[validKeys[i]]);
      });
    }

    async function tick() {
      const { keys, times } = await fetchQueue();
      renderQueue(keys, times);
    }

    const OVERLAY_FONTS = {
      notosanskr: { family: `"Noto Sans KR", sans-serif`, google: "Noto+Sans+KR:wght@400;700;900" },
      nanumgothic: { family: `"Nanum Gothic", sans-serif`, google: "Nanum+Gothic:wght@400;700;800" },
      nanummyeongjo: { family: `"Nanum Myeongjo", serif`, google: "Nanum+Myeongjo:wght@400;700;800" },
      gothica1: { family: `"Gothic A1", sans-serif`, google: "Gothic+A1:wght@400;700;900" },
      dohyeon: { family: `"Do Hyeon", sans-serif`, google: "Do+Hyeon" },
      blackhansans: { family: `"Black Han Sans", sans-serif`, google: "Black+Han+Sans" },
      jua: { family: `"Jua", sans-serif`, google: "Jua" },
      gaegu: { family: `"Gaegu", sans-serif`, google: "Gaegu:wght@400;700" },
      gamjaflower: { family: `"Gamja Flower", sans-serif`, google: "Gamja+Flower" },
      poorstory: { family: `"Poor Story", sans-serif`, google: "Poor+Story" },
      sunflower: { family: `"Sunflower", sans-serif`, google: "Sunflower:wght@300;500;700" },
      singleday: { family: `"Single Day", sans-serif`, google: "Single+Day" },
    };

    (() => {
      const params = new URLSearchParams(location.search);
      const bg = params.get("bg");
      const color = params.get("color");
      const fontKey = params.get("font");
      if (bg) document.documentElement.style.setProperty("--overlay-bg", bg);
      if (color) document.documentElement.style.setProperty("--overlay-color", color);
      const font = fontKey && OVERLAY_FONTS[fontKey];
      if (font) {
        document.documentElement.style.setProperty("--overlay-font", font.family);
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `https://fonts.googleapis.com/css2?family=${font.google}&display=swap`;
        document.head.appendChild(link);
      }
    })();

    (async () => {
      await loadSongbook();
      await tick();
      setInterval(tick, POLL_MS);
      setInterval(loadSongbook, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
